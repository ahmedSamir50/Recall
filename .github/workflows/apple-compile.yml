name: apple-compile
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android maui-ios maui-maccatalyst
      - run: dotnet build src/Recall.Maui/Recall.Maui.csproj -f net10.0-ios -r ios-arm64 -c Release
      - run: dotnet build src/Recall.Maui/Recall.Maui.csproj -f net10.0-maccatalyst -r maccatalyst-arm64 -c Release
