name: apple-compile
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: |
          for dir in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app /Applications/Xcode_27.1_Release_Candidate.app /Applications/Xcode.app; do
            if [ -d "$dir" ]; then
              sudo xcode-select -s "$dir"
              xcodebuild -version
              exit 0
            fi
          done
          ls /Applications
          exit 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android maui-ios maui-maccatalyst --version 10.0.402.1
      - run: dotnet build src/Recall.Maui/Recall.Maui.csproj -f net10.0-ios -r ios-arm64 -c Release -p:EnableWindowsTargeting=true
      - run: dotnet build src/Recall.Maui/Recall.Maui.csproj -f net10.0-maccatalyst -r maccatalyst-arm64 -c Release -p:EnableWindowsTargeting=true
