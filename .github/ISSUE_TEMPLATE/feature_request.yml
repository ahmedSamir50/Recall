name: Feature request
description: Propose a change to what Recall does.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Recall's scope is decided by its plan, not by this form. [docs/plan.md](docs/plan.md) lists every task and what is deliberately not built (no web app, no clipboard or camera capture, no speech-to-text model, no chat UI, no sync transport in v1). A request is accepted when it maps onto that plan or argues convincingly for a new task in it.
  - type: input
    id: plan-task
    attributes:
      label: Plan task id
      description: The task id in docs/plan.md this request belongs to, or `new-task` if you are arguing for one.
      placeholder: P.1.2 or new-task
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where Recall stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What you would change, and which part of the plan it touches. "Why is this not already a task?" counts.
    validations:
      required: true
  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope check
      description: These are decisions already taken in the plan. Directive-shaped requests for them will be closed as out of scope.
      options:
        - label: I checked docs/plan.md and this is not one of the already-excluded behaviors.
          required: true
