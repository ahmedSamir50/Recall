<!doctype html><html lang="en" dir="ltr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recall — your memory, searchable, on your device</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="tw.js"></script><link rel="stylesheet" href="tokens.css"></head>
<body><canvas id="bg" aria-hidden="true"></canvas><div class="scrim"></div><div id="app" class="relative z-10"></div>
<script type="module">
import {mountLattice} from './shader.js';
const Q=new URLSearchParams(location.search);let lang=Q.get('lang')||'en',theme=Q.get('theme')||'dark';
const T={en:{nav:['How it works','Privacy','Requirements'],get:'Get Recall',k:'Windows · Android · iPhone',h:'Your memory.<br><span class="cy">Searchable. Private.</span>',p:'Ask in a sentence and Recall finds the photo, the voice memo, the page or the line of code — using models that run on this device. Nothing leaves it.',b1:'Download for Windows',b2:'See how it stays private',
facts:[['0 KB','sent to any server'],['38 ms','typical search on laptop'],['4','kinds: photo · voice · docs · code']],
ph:'Built for privacy first',pp:'No account. No cloud index. No telemetry. Every step below happens on your device.',
cards:[['shield','Local only','Your files are read in place from folders you pick. The index lives in an encrypted local database.','em'],['img','One search, every kind','Photos, voice memos, PDFs and code share one meaning space — so “red scooter” finds all of them.','cy'],['lock','Verified models','Models download once and are checked against a SHA-256 hash. A failed check is discarded and retried.','vi'],['mic','Honest limits','Voice-memo search runs on desktop in v1. Device sync isn’t in this version.','am']],
hh:'Three steps, then it’s quiet',steps:[['Choose folders','Only what you pick is indexed.'],['Download models','One time, ~2.2 GB, verified.'],['Ask','Find, group or tag in plain language.']],
ch:'Take your memory back.',cp:'Free while in preview. English and Arabic.',foot:'Recall · made for one person: you.'},
ar:{nav:['كيف يعمل','الخصوصية','المتطلبات'],get:'احصل على ريكول',k:'ويندوز · أندرويد · آيفون',h:'ذاكرتك.<br><span class="cy">قابلة للبحث. خاصة.</span>',p:'اسأل بجملة، ويجد ريكول الصورة أو الملاحظة الصوتية أو الصفحة أو سطر الكود — بنماذج تعمل على جهازك. لا يغادره شيء.',b1:'نزّل لويندوز',b2:'كيف تبقى بياناتك خاصة',
facts:[['٠ ك.ب','تُرسل لأي خادم'],['٣٨ م.ث','بحث نموذجي على الحاسوب'],['٤','أنواع: صور · صوت · مستندات · كود']],
ph:'الخصوصية أولًا',pp:'بلا حساب. بلا فهرس سحابي. بلا تتبّع. كل خطوة أدناه تحدث على جهازك.',
cards:[['shield','محلي فقط','تُقرأ ملفاتك في مكانها من المجلدات التي تختارها. يعيش الفهرس في قاعدة بيانات محلية مشفّرة.','em'],['img','بحث واحد لكل الأنواع','الصور والملاحظات الصوتية والمستندات والكود في فضاء معنى واحد — فتجد «سكوتر أحمر» كلها.','cy'],['lock','نماذج موثّقة','تُنزّل النماذج مرة واحدة ويُتحقق منها ببصمة SHA-256. أي فشل يُحذف ويُعاد.','vi'],['mic','حدود واضحة','البحث في الملاحظات الصوتية على الكمبيوتر في الإصدار ١. المزامنة بين الأجهزة ليست في هذا الإصدار.','am']],
hh:'ثلاث خطوات، ثم يعمل بهدوء',steps:[['اختر المجلدات','يُفهرس ما تختاره فقط.'],['نزّل النماذج','مرة واحدة، نحو ٢٫٢ غ.ب، موثّقة.'],['اسأل','ابحث أو جمّع أو وسِّم بلغة عادية.']],
ch:'استعد ذاكرتك.',cp:'مجاني خلال المعاينة. بالعربية والإنجليزية.',foot:'ريكول · صُنع لشخص واحد: أنت.'}};
const I={shield:'<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6Z"/><path d="m9 12 2 2 4-4"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',lat:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8m2 0 5-8"/>'};
const ic=(n,c='w-5 h-5')=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
function render(){const t=T[lang];const h=document.documentElement;h.lang=lang;h.dir=lang=='ar'?'rtl':'ltr';h.dataset.theme=theme;
document.getElementById('app').innerHTML=`<header class="g1 sticky top-0 z-20 border-b bd"><div class="max-w-[1200px] mx-auto h-14 px-5 flex items-center gap-6">
<a class="flex items-center gap-2.5 f-head font-semibold"><span class="w-7 h-7 rounded-lg grid place-items-center cy" style="background:color-mix(in srgb,var(--cyan) 16%,transparent)">${ic('lat','w-4 h-4')}</span>${lang=='ar'?'ريكول':'Recall'}</a>
<nav class="hidden md:flex gap-6 text-[14px] ink2">${t.nav.map(n=>`<a href="#" class="hover:ink">${n}</a>`).join('')}</nav><span class="flex-1"></span>
<button id="lg" class="btn btn-g !py-1.5 text-[13px]">${lang=='ar'?'English':'العربية'}</button><a href="index.html" class="btn btn-p !py-1.5 text-[13px]">${t.get}</a></div></header>
<section class="max-w-[1200px] mx-auto px-5 pt-16 md:pt-28 pb-16 grid lg:grid-cols-[1.1fr_.9fr] gap-12 items-center">
<div class="rise"><p class="lbl mb-5">${t.k}</p><h1 class="f-head font-bold text-[44px] md:text-[72px] leading-[1.02] mb-6">${t.h}</h1><p class="ink2 text-[17px] md:text-[19px] max-w-[540px] mb-8">${t.p}</p>
<div class="flex flex-wrap gap-3"><a href="index.html" class="btn btn-p">${t.b1}</a><a href="#p" class="btn btn-g">${t.b2}</a></div></div>
<div class="g2 rounded-2xl p-3 rise" style="animation-delay:.1s"><div class="g3 rounded-xl px-4 py-3 mb-3 text-[15px] font-medium">${lang=='ar'?'السكوتر الأحمر قرب الكولوسيوم':'red scooter near the Colosseum'}</div>
<div class="grid grid-cols-2 gap-3"><img src="img/s1.jpg" class="rounded-xl aspect-[4/3] object-cover col-span-2" alt=""><div class="rounded-xl p-3 border bd" style="background:var(--c1)"><span class="pill tag-aud text-[11px] f-mono" style="border-color:transparent">${ic('mic','w-3.5 h-3.5')}${lang=='ar'?'صوت':'Voice'}</span><p class="text-[13px] mt-2 ink2" dir="ltr">“Vespa rossa vicino al Colosseo…”</p></div><div class="rounded-xl p-3 border bd" style="background:var(--c1)"><span class="pill tag-doc text-[11px] f-mono" style="border-color:transparent">PDF</span><p class="text-[13px] mt-2 ink2">${lang=='ar'?'قائمة القطع · ص ٣':'Parts list · p.3'}</p></div></div></div></section>
<section class="max-w-[1200px] mx-auto px-5 pb-20"><dl class="g2 rounded-2xl grid sm:grid-cols-3">${t.facts.map((f,i)=>`<div class="p-6 ${i?'border-t sm:border-t-0 sm:border-s bd':''}"><dt class="f-head font-bold text-[34px] cy"><bdi>${f[0]}</bdi></dt><dd class="ink2">${f[1]}</dd></div>`).join('')}</dl></section>
<section id="p" class="max-w-[1200px] mx-auto px-5 pb-24"><h2 class="f-head font-bold text-[32px] md:text-[44px] mb-3">${t.ph}</h2><p class="ink2 text-[17px] max-w-[620px] mb-10">${t.pp}</p>
<div class="grid md:grid-cols-2 gap-4">${t.cards.map(([i,h,p,c])=>`<article class="card g2 p-6"><span class="${c} block mb-4">${ic(i,'w-6 h-6')}</span><h3 class="f-head font-semibold text-[20px] mb-2">${h}</h3><p class="ink2">${p}</p></article>`).join('')}</div></section>
<section class="max-w-[1200px] mx-auto px-5 pb-24"><h2 class="f-head font-bold text-[32px] md:text-[44px] mb-10">${t.hh}</h2><ol class="grid md:grid-cols-3 gap-4">${t.steps.map((s,i)=>`<li class="border-t-2 pt-5" style="border-color:${i==0?'var(--cyan-ink)':'var(--line-2)'}"><span class="f-mono cy text-[13px]">0${i+1}</span><h3 class="f-head font-semibold text-[20px] mt-2 mb-1">${s[0]}</h3><p class="ink2">${s[1]}</p></li>`).join('')}</ol></section>
<section class="max-w-[1200px] mx-auto px-5 pb-20"><div class="g3 rounded-3xl p-10 md:p-16 text-center"><h2 class="f-head font-bold text-[36px] md:text-[52px] mb-3">${t.ch}</h2><p class="ink2 mb-8">${t.cp}</p><a href="index.html" class="btn btn-p">${t.b1}</a></div></section>
<footer class="border-t bd py-8 text-center text-[13px] ink3">${t.foot}</footer>`;
document.getElementById('lg').onclick=()=>{lang=lang=='ar'?'en':'ar';render()}}
render();mountLattice(document.getElementById('bg'),{theme});
</script></body></html>
